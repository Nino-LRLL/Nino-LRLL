# Bonus gitskins — Space Shooter sur la grille de contributions.
# Génère contribution-game.gif chaque nuit et le commit tout seul.
# Aucun token personnel requis : le token automatique GITHUB_TOKEN suffit
# (lecture des contributions publiques + commit dans le repo).
name: Update Profile Game
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # Dépendances système requises par node-canvas (rendu du GIF).
      - name: Install system deps (canvas)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - run: npm install
      - name: Generate GIF
        run: node game.js ${{ github.repository_owner }}
        env:
          CONTRIBUTION_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and Push
        run: |
          git config user.name "GitHub-Game-Bot"
          git config user.email "actions@github.com"
          git add contribution-game.gif
          git commit -m "chore: updated game stats" || exit 0
          git push
